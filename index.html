<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>放風 - 戶外探險即時地圖</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        /* 參考圖片設計：經典藍色定位針 + 上方對話框暱稱 */
        .custom-pin-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -100%);
        }
        .pin-bubble {
            background: #ffffff;
            color: #0f172a;
            font-weight: 900;
            font-size: 13px;
            padding: 3px 10px;
            border-radius: 6px;
            border: 2px solid #0f172a;
            white-space: nowrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            margin-bottom: 2px;
        }
        .pin-icon {
            width: 28px;
            height: 38px;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
        }
    </style>
</head>
<body class="relative overflow-hidden h-screen">

    <!-- 全螢幕地圖 -->
    <div id="map" class="absolute inset-0"></div>

    <!-- 步驟 1：極簡登入卡片 -->
    <div id="loginCard" class="absolute inset-0 z-30 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl w-full max-w-sm space-y-5">
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-black text-sky-400 tracking-wider">🏕️ 放風</h1>
                <p class="text-xs text-slate-400">輸入活動代號與暱稱即可開始連線</p>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 font-medium mb-1 block">活動名稱代號</label>
                    <input type="text" id="inputRoomId" placeholder="例如: taiwan 168" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-400 font-bold">
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-medium mb-1 block">你的暱稱</label>
                    <input type="text" id="inputUserName" placeholder="例如: 阿忠" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-400 font-bold">
                </div>
            </div>

            <button id="startBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold py-3 rounded-xl shadow-lg shadow-sky-500/20 transition active:scale-95">
                進入放風地圖
            </button>
        </div>
    </div>

    <!-- 頂部極簡資訊橫條 -->
    <div id="topHeader" class="hidden absolute top-4 left-4 right-4 z-10 flex justify-between items-center pointer-events-none">
        <div class="bg-slate-900/90 backdrop-blur-md px-4 py-2 rounded-2xl border border-slate-800 shadow-lg pointer-events-auto flex items-center space-x-2">
            <span class="text-xs text-slate-400">活動:</span>
            <span id="displayRoomId" class="text-sm font-bold text-sky-400"></span>
        </div>
        <div class="bg-slate-900/90 backdrop-blur-md px-4 py-2 rounded-2xl border border-slate-800 shadow-lg pointer-events-auto flex items-center space-x-2">
            <span id="displayUserName" class="text-sm font-bold text-slate-200"></span>
        </div>
    </div>

    <!-- 底部點擊導航卡片 -->
    <div id="navCard" class="hidden absolute bottom-6 left-4 right-4 z-20 bg-slate-900/95 backdrop-blur-xl border border-slate-800 p-4 rounded-2xl shadow-2xl flex items-center justify-between">
        <div>
            <div class="flex items-center space-x-2">
                <span id="targetName" class="text-base font-bold text-slate-100"></span>
            </div>
            <p id="targetDistance" class="text-xs text-sky-400 font-semibold mt-0.5"></p>
        </div>
        <a id="targetNavBtn" href="#" target="_blank" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-4 py-2.5 rounded-xl text-xs transition shadow-lg flex items-center gap-1 shrink-0">
            <span>🧭</span>
            <span>開車導航去會合</span>
        </a>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://fangfeng-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
        let myRoomId = '';
        let myName = '';
        let myLat = 22.6273, myLng = 120.3014;

        const map = L.map('map', { zoomControl: false }).setView([myLat, myLng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(map);

        let onlineMembers = {};
        let markersMap = {};

        function getDistanceText(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const meters = Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))));
            return meters > 1000 ? `距離你 ${(meters/1000).toFixed(1)} 公里` : `距離你 ${meters} 公尺`;
        }

        function syncToFirebase() {
            if (!myRoomId) return;
            const userRef = ref(database, `rooms/${myRoomId}/${myUserId}`);
            set(userRef, {
                id: myUserId,
                name: myName,
                lat: myLat,
                lng: myLng,
                lastSeen: Date.now()
            });
            onDisconnect(userRef).remove();
        }

        function listenRoomData() {
            const roomRef = ref(database, `rooms/${myRoomId}`);
            onValue(roomRef, (snapshot) => {
                onlineMembers = snapshot.val() || {};
                renderMap();
            });
        }

        function renderMap() {
            Object.values(markersMap).forEach(m => map.removeLayer(m));
            markersMap = {};

            const membersArr = Object.values(onlineMembers);

            membersArr.forEach(member => {
                const isMe = member.id === myUserId;
                
                // 使用 SVG 建立經典藍色定位針，上方帶有如同參考圖片的對話框暱稱
                const customIcon = L.divIcon({
                    className: '',
                    html: `
                        <div class="custom-pin-container">
                            <div class="pin-bubble">${member.name}${isMe ? ' (你)' : ''}</div>
                            <svg class="pin-icon" viewBox="0 0 24 24" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5">
                                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path>
                                <circle cx="12" cy="9" r="3.5" fill="#ffffff"></circle>
                            </svg>
                        </div>
                    `,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });

                const marker = L.marker([member.lat, member.lng], { icon: customIcon }).addTo(map);
                markersMap[member.id] = marker;

                marker.on('click', () => {
                    if (isMe) {
                        document.getElementById('navCard').classList.add('hidden');
                        return;
                    }
                    const distStr = getDistanceText(myLat, myLng, member.lat, member.lng);
                    document.getElementById('targetName').innerText = member.name;
                    document.getElementById('targetDistance').innerText = distStr;
                    document.getElementById('targetNavBtn').href = `https://www.google.com/maps/dir/?api=1&destination=${member.lat},${member.lng}&travelmode=driving`;
                    document.getElementById('navCard').classList.remove('hidden');
                });
            });
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            const roomVal = document.getElementById('inputRoomId').value.trim();
            const nameVal = document.getElementById('inputUserName').value.trim();

            if (!roomVal || !nameVal) {
                alert('請輸入活動名稱代號與暱稱！');
                return;
            }

            myRoomId = roomVal.toLowerCase().replace(/\s+/g, '_');
            myName = nameVal;

            document.getElementById('displayRoomId').innerText = roomVal;
            document.getElementById('displayUserName').innerText = nameVal;

            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('topHeader').classList.remove('hidden');

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    myLat = pos.coords.latitude;
                    myLng = pos.coords.longitude;
                    map.setView([myLat, myLng], 15);
                    syncToFirebase();
                }, (err) => console.warn(err), { enableHighAccuracy: true });
            }

            listenRoomData();
            syncToFirebase();
        });

        map.on('click', () => {
            document.getElementById('navCard').classList.add('hidden');
        });
    </script>
</body>
</html>

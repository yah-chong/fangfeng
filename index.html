<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山林即時定位與雙向互助導航</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- 頂部資訊看板 -->
    <header class="bg-emerald-800 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold">山林即時定位系統</h1>
            <p class="text-xs text-emerald-200">房間代號: <span id="roomDisplay" class="font-mono bg-emerald-900 px-2 py-0.5 rounded">trip_001</span></p>
        </div>
        <div id="distanceInfo" class="text-sm bg-emerald-700 px-3 py-1 rounded-full">尋找雙方定位中...</div>
    </header>

    <!-- 地圖容器 -->
    <div id="map" class="flex-grow z-0"></div>

    <!-- 底部控制面板 -->
    <div class="bg-white p-4 shadow-lg flex gap-3">
        <button id="toggleHikerBtn" class="flex-1 bg-emerald-600 text-white py-3 rounded-lg font-bold shadow hover:bg-emerald-700 transition">
            開啟我的定位
        </button>
        <button id="navigateBtn" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold shadow hover:bg-blue-700 transition opacity-50 cursor-not-allowed" disabled>
            導航至對方位置
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDK (v9+ Modular CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 1. 替換為你的 Firebase 控制台憑證
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 從 URL 參數抓取房間代號 (例如: index.html?room=mountain101)
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'trip_001';
        document.getElementById('roomDisplay').textContent = roomId;

        // 定義資料庫路徑：這次行程中的登山客 (hiker) 與 朋友 (friend)
        const hikerRef = ref(db, `trips/${roomId}/hiker`);
        const friendRef = ref(db, `trips/${roomId}/friend`);

        // 初始化 Leaflet 地圖 (以台灣中心點為預設)
        const map = L.map('map').setView([23.5, 121], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let hikerMarker = null;
        let friendMarker = null;
        let watchId = null;
        let isSharing = false;

        let myCoords = null;
        let friendCoords = null;

        const toggleBtn = document.getElementById('toggleHikerBtn');
        const navBtn = document.getElementById('navigateBtn');
        const distanceInfo = document.getElementById('distanceInfo');

        // 計算兩點距離函數 (Haversine Formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球半徑 (公里)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            if (distance < 1) {
                return `兩者相距 ${(distance * 1000).toFixed(0)} 公尺`;
            }
            return `兩者相距 ${distance.toFixed(2)} 公里`;
        }

        // 更新兩者距離看板
        function updateDistanceDisplay() {
            if (myCoords && friendCoords) {
                const text = calculateDistance(myCoords.lat, myCoords.lon, friendCoords.lat, friendCoords.lon);
                distanceInfo.textContent = text;
                
                // 啟用導航按鈕
                navBtn.disabled = false;
                navBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else if (myCoords) {
                distanceInfo.textContent = "等待對方分享定位...";
            } else if (friendCoords) {
                distanceInfo.textContent = "已抓取對方定位，尚未開啟我的定位";
            } else {
                distanceInfo.textContent = "等待雙方定位中...";
            }
        }

        // 2. 開啟 / 關閉我的定位上傳
        toggleBtn.addEventListener('click', () => {
            if (!isSharing) {
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition((position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        myCoords = { lat, lon };

                        // 更新本地地圖標記
                        if (!hikerMarker) {
                            hikerMarker = L.marker([lat, lon]).addTo(map).bindPopup("我的位置 (登山客)").openPopup();
                            map.setView([lat, lon], 15);
                        } else {
                            hikerMarker.setLatLng([lat, lon]);
                        }

                        // 【重點】：即時寫入資料至 Firebase (獨立節點 trips/{roomId}/hiker)
                        set(hikerRef, {
                            lat: lat,
                            lon: lon,
                            timestamp: Date.now()
                        });

                        updateDistanceDisplay();

                    }, (err) => {
                        alert('無法取得 GPS 定位：' + err.message);
                    }, { enableHighAccuracy: true });

                    isSharing = true;
                    toggleBtn.textContent = "關閉我的定位";
                    toggleBtn.className = "flex-1 bg-rose-600 text-white py-3 rounded-lg font-bold shadow hover:bg-rose-700 transition";
                } else {
                    alert('瀏覽器不支援地理定位');
                }
            } else {
                // 停止手機 GPS 監控
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }

                // 【重點】：從 Firebase 移除定位紀錄，維持隱私
                remove(hikerRef);

                if (hikerMarker) {
                    map.removeLayer(hikerMarker);
                    hikerMarker = null;
                }

                myCoords = null;
                isSharing = false;
                toggleBtn.textContent = "開啟我的定位";
                toggleBtn.className = "flex-1 bg-emerald-600 text-white py-3 rounded-lg font-bold shadow hover:bg-emerald-700 transition";
                updateDistanceDisplay();
            }
        });

        // 3. 監聽「朋友」在 Firebase 上的定位變化
        onValue(friendRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.lat && data.lon) {
                friendCoords = { lat: data.lat, lon: data.lon };

                // 繪製或更新朋友地圖標記
                if (!friendMarker) {
                    friendMarker = L.marker([data.lat, data.lon]).addTo(map).bindPopup("朋友的位置");
                } else {
                    friendMarker.setLatLng([data.lat, data.lon]);
                }
            } else {
                // 朋友關閉定位時移除標記
                if (friendMarker) {
                    map.removeLayer(friendMarker);
                    friendMarker = null;
                }
                friendCoords = null;
            }
            updateDistanceDisplay();
        });

        // 4. 一鍵啟動外部地圖導航至對方位置
        navBtn.addEventListener('click', () => {
            if (friendCoords) {
                const url = `https://www.google.com/maps/dir/?api=1&destination=${friendCoords.lat},${friendCoords.lon}&travelmode=walking`;
                window.open(url, '_blank');
            }
        });
    </script>
</body>
</html>
